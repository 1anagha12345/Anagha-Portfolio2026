<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form>
        <fieldset>
            <legend>Student Details</legend>
        
        <label for="Name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="Age">Age:</label>
        <input type="number" id="age" name="age"><br><br>
        <label for="Email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="file">upload file:</label>
        <input type="file" id="file" name="file">
        <br><br>
         <input type="submit" value="submit">
        <input type="reset" value="Reset"><br><br>
        <label for="Gender">Gender:</label><br><br>
        
             <label for="female">female</label><br><br>
             <input type="radio" id="female" name="gender" value="female"><br><br>
         <label for="male">male</label><br><br>
          <input type="radio" id="male" name="gender" value="male"><br><br>
        <label for="password">password:</label>
        <input type="password" id="password" name="password"><br><br>
        <label for="country">country:</label>
        <select id="country" name="country">
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Canada">Canada</option>
        </select><br><br>
        <input type="checkbox" id="terms" name="terms">
        <label for="terms"> I agree to terms and conditons</label><br><br>
        <label for="messege">Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="60"></textarea>
        <br><br>


        <input type="submit" value="submit">
        <input type="reset" value="Reset">
        </fieldset>
        </form>
</body>
</html>
